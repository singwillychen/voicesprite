<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文字轉語音｜VoiceSprite 聲線工坊</title>
  <meta name="description" content="選擇角色與聲線特徵檔，輸入文字，調整語速、語氣與情緒後播放。">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body data-page="tts">
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="index.html"><span>VS</span>VOICE SPRITE</a>
      <nav class="site-nav" aria-label="主選單">
        <a href="index.html" data-page="home">首頁</a>
        <a href="record.html" data-page="record">錄製聲紋</a>
        <a href="tts.html" data-page="tts">文字轉語音</a>
        <a href="live.html" data-page="live">直播模式</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <header class="page-head">
      <p class="sticker">STEP 2</p>
      <h1>讓角色開口說話</h1>
      <p>選擇聲線特徵檔與角色，輸入文字後調整語速、語氣和情緒。按 Ctrl（Mac 用 ⌘）+ Enter 也能直接播放。</p>
    </header>

    <div class="tts-grid">
      <section class="card stage" id="stage" aria-label="角色舞台">
        <div class="speech-bubble" id="bubble" aria-live="polite">按下播放，我就開始說話！</div>
        <div class="stage-char" id="stageChar"></div>
        <div class="stage-name" id="stageName"></div>
      </section>

      <section class="card controls">
        <div class="ctl-block">
          <h2>語音引擎</h2>
          <div class="engine-list" id="engineList" role="radiogroup" aria-label="語音引擎"></div>
        </div>

        <div class="ctl-block">
          <h2>角色</h2>
          <div class="char-strip" id="charStrip" role="group" aria-label="選擇角色"></div>
        </div>

        <div class="ctl-block">
          <div class="field">
            <label class="field-label" for="profileSelect">聲線特徵檔 <a class="small" href="record.html">錄製新的聲紋</a></label>
            <select id="profileSelect"></select>
            <div class="profile-summary" id="profileSummary"></div>
          </div>
          <div class="field" style="margin-bottom:0">
            <label class="field-label" for="voiceSelect">系統語音</label>
            <select id="voiceSelect"></select>
          </div>
        </div>

        <div class="ctl-block">
          <div class="field" style="margin-bottom:0">
            <label class="field-label" for="ttsText">要說的話</label>
            <textarea id="ttsText" maxlength="500" placeholder="輸入想讓角色說的話…"></textarea>
            <div class="text-meta"><span>支援中文與標點停頓</span><span id="charCount">0 / 500</span></div>
            <div class="phrases" id="phrases"></div>
          </div>
        </div>

        <div class="ctl-block">
          <div class="field">
            <span class="field-label">情緒</span>
            <div class="seg" id="emotionSeg" role="group" aria-label="情緒"></div>
          </div>
          <div class="field">
            <span class="field-label">語氣</span>
            <div class="seg" id="toneSeg" role="group" aria-label="語氣"></div>
          </div>
          <div class="sliders">
            <div class="field">
              <label class="field-label" for="rate">語速 <output id="rateVal">1.00×</output></label>
              <input type="range" id="rate" min="0.5" max="2" step="0.05" value="1">
            </div>
            <div class="field">
              <label class="field-label" for="pitch">音高微調 <output id="pitchVal">0</output></label>
              <input type="range" id="pitch" min="-6" max="6" step="1" value="0">
            </div>
            <div class="field">
              <label class="field-label" for="volume">音量 <output id="volumeVal">90%</output></label>
              <input type="range" id="volume" min="0" max="100" step="1" value="90">
            </div>
          </div>
          <div class="readout" id="readout">讀取語音中…</div>
        </div>

        <div class="ctl-block">
          <div class="play-row">
            <button type="button" class="btn btn-pink btn-lg" id="btnPlay">▶ 播放</button>
            <button type="button" class="btn" id="btnStop" disabled>■ 停止</button>
            <button type="button" class="btn" id="btnDownload">下載 WAV</button>
          </div>
          <p class="small muted" id="downloadNote" style="margin:10px 0 0"></p>
          <label class="check" style="margin-top:14px">
            <input type="checkbox" id="syncLive">
            <span>同步到直播模式頁（同一個瀏覽器）<a href="live.html" target="_blank" rel="noopener">開啟直播模式 ↗</a></span>
          </label>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container inner">
      <a class="logo" href="index.html"><span>VS</span>VOICE SPRITE</a>
      <p>所有錄音與特徵檔只存在你的瀏覽器，不會上傳。請只錄製本人或已取得同意者的聲音。</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/audio-utils.js"></script>
  <script src="js/features.js"></script>
  <script src="js/profile-store.js"></script>
  <script src="js/engines/engine-a-webspeech.js"></script>
  <script src="js/engines/engine-b-transformers.js"></script>
  <script src="js/engines/engine-local.js"></script>
  <script src="js/tts.js"></script>
  <script>
  /* 檔案不完整時（例如直接在壓縮檔裡打開、只傳了 html），顯示說明而不是空白頁 */
  (function () {
    var cssOk = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() !== '';
    var jsOk = !!(window.VS && window.VS.engines);
    if (cssOk && jsOk) return;
    var d = document.createElement('div');
    d.setAttribute('role', 'alert');
    d.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#fffbe0;color:#141414;font:16px/1.8 system-ui,sans-serif;padding:24px;overflow:auto';
    d.innerHTML = '<div style="max-width:640px;margin:0 auto">' +
      '<h1 style="font-size:24px;margin:0 0 12px">網站檔案不完整，無法正常顯示</h1>' +
      '<p>這個網頁需要和 <b>css</b>、<b>js</b>、<b>images</b> 三個資料夾放在一起才能運作，目前讀不到它們。</p>' +
      '<ol>' +
      '<li>如果收到的是壓縮檔（.zip），請先按右鍵「<b>全部解壓縮</b>」，再打開解壓後資料夾裡的 index.html。不要直接在壓縮檔裡點開。</li>' +
      '<li>確認 index.html 旁邊有 css、js、images 三個資料夾。用 LINE 等通訊軟體傳檔時，資料夾常會不見，請改傳整個壓縮檔。</li>' +
      '<li><b>最推薦</b>：請對方直接打開網站的 GitHub Pages 網址。錄製聲紋也只有網址版能使用麥克風。</li>' +
      '</ol></div>';
    document.body.appendChild(d);
  })();
  </script>
</body>
</html>
